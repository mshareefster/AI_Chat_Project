# Replace YOUR_EC2_IP with your actual setup if needed.
# This VirtualHost assumes Apache is already installed.

<VirtualHost *:80>
    ServerName chat.hudamusthafa.tech

    DocumentRoot /var/www/huda-ai/frontend/dist

    <Directory /var/www/huda-ai/frontend/dist>
        Options -Indexes
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    ErrorLog /var/log/httpd/huda-ai-error.log
    CustomLog /var/log/httpd/huda-ai-access.log combined
</VirtualHost>
